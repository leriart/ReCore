name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: CSS interpreter lints
        run: cargo clippy -p recore-css --all-targets --locked -- -D warnings
      - name: CSS interpreter tests
        run: cargo test -p recore-css --locked

  # The Discord protocol and the core build libwebrtc and the vendored
  # encoders, which need the development shell (a C++ toolchain and NASM), so
  # `scripts/check --fast` covers them on a development machine. The window
  # kit builds without them and runs here.
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: The window kit's tests
        run: cargo test -p recore-iced-kit --locked
